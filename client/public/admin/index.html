<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Trombone Collection Admin</title>
  <link rel="icon" href="/images/favicon.ico" />
</head>
<body>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
  <script>
    // Point the GitHub login at this site's own OAuth function (functions/oauth/),
    // so it works on any domain the site is deployed to.
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'maximusunc/tromboneCollection',
          branch: 'master',
          base_url: window.location.origin,
          auth_endpoint: 'oauth/auth',
        },
      },
    });
  </script>
</body>
</html>
